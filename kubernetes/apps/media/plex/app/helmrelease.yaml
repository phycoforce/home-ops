---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  chartRef:
    kind: OCIRepository
    name: plex
  interval: 1h
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.4.10903@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149
            env:
              TZ: Europe/London
              PLEX_ADVERTISE_URL: https://plex.${SECRET_DOMAIN}:443,http://10.0.20.245:32400,http://plex.media.svc.cluster.local:32400
              ALLOWED_NETWORKS: "10.0.10.0/24"
              PLEX_PREFERENCE_LAN: "LanNetworksBandwidth=10.0.0.0/8"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: &port 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 4Gi
              limits:
                memory: 10Gi
    defaultPodOptions:
      # Soft-pin to logos, sharing its iGPU with llama-rerank. Preferred rather than
      # required: the exclusive plex-gpu claim already limits plex to a node whose
      # GPU is unclaimed, so a hard pin would only add rigidity during node outages.
      # Layout table: kubernetes/apps/kube-system/intel-gpu-resource-driver/app/helmrelease.yaml
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [logos]
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: plex-gpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 10000]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: 10.0.20.245
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            path: /identity
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - name: app
            backendRefs: &backendRefs
              - identifier: app
                port: *port
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier: &pipeline
                  set:
                    # Plex closes idle keep-alive connections after 20s unless this is set, so Envoy owns the pool
                    - name: X-Plex-Http-Pipeline
                      value: infinite
          - name: events
            backendRefs: *backendRefs
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier: *pipeline
            matches:
              - path:
                  type: PathPrefix
                  value: /:/eventsource
              - path:
                  type: PathPrefix
                  value: /:/websockets
          - # Ref: https://forums.plex.tv/t/external-srt-subtitles-are-not-working-w-reverse-proxy/886540
            name: subtitles
            backendRefs: *backendRefs
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  <<: *pipeline
                  remove:
                    - Range
            matches:
              - path:
                  type: PathPrefix
                  value: /library/streams
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      tmp:
        type: emptyDir
      media:
        type: nfs
        server: aionios.internal
        path: /mnt/mechonis/media
        globalMounts:
          - path: /media
            readOnly: true
