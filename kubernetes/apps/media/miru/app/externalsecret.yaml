---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: miru
spec:
  length: 64
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - MIRU_ENCRYPTION_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: miru
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    generatorRef:
      kind: Password
      name: miru
  data:
    - match:
        secretKey: &key MIRU_ENCRYPTION_KEY
        remoteRef:
          remoteKey: miru
          property: *key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miru
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: miru-secret
    template:
      engineVersion: v2
      data:
        MIRU_ENCRYPTION_KEY: "{{ .MIRU_ENCRYPTION_KEY }}"
        PLEX_TOKEN: "{{ .PLEX_TOKEN }}"
  dataFrom:
    - extract:
        key: miru
    - extract:
        key: plex
