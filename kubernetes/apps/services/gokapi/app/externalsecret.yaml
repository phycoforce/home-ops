---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gokapi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gokapi-secret
    template:
      engineVersion: v2
      data:
        GOKAPI_DEPLOYMENT_PASSWORD: "{{ .GOKAPI_PASSWORD }}"
        # Headless Gokapi config (ConfigVersion 22 == v2.2.x). Storage is ephemeral,
        # so the init container copies this into a fresh /config on every pod start
        # and runs --deployment-password to create the super-admin. With a config
        # present Gokapi never serves its public first-run /setup wizard.
        # Empty salts are regenerated by Gokapi on load and persisted by that run.
        config.json: |
          {
            "Authentication": {
              "Method": 0,
              "SaltAdmin": "",
              "SaltFiles": "",
              "Username": "{{ .GOKAPI_USERNAME | lower }}",
              "HeaderKey": "",
              "OauthProvider": "",
              "OAuthClientId": "",
              "OAuthClientSecret": "",
              "OauthGroupScope": "",
              "OAuthRecheckInterval": 168,
              "OAuthGroups": [],
              "OnlyRegisteredUsers": false
            },
            "Port": ":53842",
            "ServerUrl": "https://drop.${SECRET_DOMAIN_2}/",
            "RedirectUrl": "https://drop.${SECRET_DOMAIN_2}/admin",
            "PublicName": "Drop",
            "DataDir": "/data",
            "DatabaseUrl": "sqlite:///data/gokapi.sqlite",
            "ConfigVersion": 22,
            "MaxFileSizeMB": 20480,
            "MaxMemory": 50,
            "ChunkSize": 45,
            "MaxParallelUploads": 3,
            "Encryption": {
              "Level": 0,
              "Cipher": null,
              "Salt": "",
              "Checksum": "",
              "ChecksumSalt": ""
            },
            "UseSsl": false,
            "PicturesAlwaysLocal": false,
            "SaveIp": true,
            "IncludeFilename": true
          }
  dataFrom:
    - extract:
        key: gokapi
