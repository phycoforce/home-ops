---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  interval: 1h
  values:
    # Rook-compatible values, see
    # https://github.com/rook/rook/blob/v1.20.6/deploy/charts/ceph-csi-drivers/values.yaml
    # NOTE: keep this chart pinned to the same version as the ceph-csi-operator
    # subchart bundled in the rook-ceph operator chart (Chart.yaml dependency).
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
        nodePlugin:
          priorityClassName: system-node-critical
          resources:
            plugin:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            registrar:
              limits:
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
        controllerPlugin:
          priorityClassName: system-cluster-critical
          resources:
            attacher:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            omapGenerator:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            plugin:
              limits:
                memory: 1Gi
              requests:
                memory: 512Mi
            provisioner:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            resizer:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            snapshotter:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        # Chart defaults render grpcTimeout 30, replicas 1 and log rotation on;
        # replicas must be set per-driver, driverSpecDefaults does not propagate it
        grpcTimeout: 150
        snapshotPolicy: volumeSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      cephfs:
        enabled: false
        name: rook-ceph.cephfs.csi.ceph.com
        snapshotPolicy: none
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com
        snapshotPolicy: none
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com
