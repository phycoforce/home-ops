---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/kopiur
resources:
  - ./backendtlspolicy.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
patches:
  # Keep this in the native Kustomization: cluster-apps replaces each Flux
  # Kustomization's spec.patches with Helm defaults, discarding per-app patches.
  # An unprivileged restore writes files as the mover's UID. WiredTiger uses
  # O_NOATIME, which requires the file owner, so restore as UniFi's UID 1001.
  - target:
      group: kopiur.home-operations.com
      kind: Restore
    patch: |
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      metadata:
        name: unifi
      spec:
        mover:
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
