---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unifi
spec:
  components:
    - ../../../../components/kopiur
  patches:
    # kopiur restore movers run as the image's UID 65532 unless told otherwise
    # and, being unprivileged, cannot chown, so restored files end up owned by
    # 65532. mongod opens WiredTiger files with O_NOATIME, which the kernel only
    # allows for the file OWNER, so a 65532-owned restore crash-loops mongod
    # (exit 100, "Operation not permitted"). Restore as the app's own uid.
    - target:
        kind: Restore
      patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: Restore
        metadata:
          name: unifi
        spec:
          mover:
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: certificates-import
    - name: multus-networks
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/network/unifi/app
  postBuild:
    substitute:
      APP: unifi
      KOPIUR_CAPACITY: 10Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  targetNamespace: network
