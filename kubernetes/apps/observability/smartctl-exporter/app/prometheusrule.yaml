---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-exporter-rules
spec:
  groups:
    - name: smartctl-exporter.rules
      rules:
        - record: smart:device_temperature:current
          expr: |
            smartctl_device_temperature{temperature_type="current"}
              * on (instance, device) group_left (model_name) smartctl_device

        - record: smart:device_temperature_threshold:warning
          expr: |
            (smartctl_device{model_name=~"Micron_7450_.*"} * 0 + 75)
            or (smartctl_device{model_name=~"SAMSUNG MZ.*"} * 0 + 75)
            or (smartctl_device{model_name=~"Samsung SSD 9.*"} * 0 + 75)
            or (smartctl_device{model_name=~"Samsung Portable.*"} * 0 + 60)
            or (smartctl_device{model_name=~"ST[0-9]+NM.*"} * 0 + 52)
            or (smartctl_device * 0 + 65)

        - record: smart:device_temperature_threshold:critical
          expr: |
            (smartctl_device{model_name=~"Micron_7450_.*"} * 0 + 78)
            or (smartctl_device{model_name=~"SAMSUNG MZ.*"} * 0 + 80)
            or (smartctl_device{model_name=~"Samsung SSD 9.*"} * 0 + 82)
            or (smartctl_device{model_name=~"Samsung Portable.*"} * 0 + 70)
            or (smartctl_device{model_name=~"ST[0-9]+NM.*"} * 0 + 58)
            or (smartctl_device * 0 + 70)

        - alert: SmartDeviceHighTemperature
          expr: |
            smart:device_temperature:current
              >= on (instance, device) group_left ()
                 smart:device_temperature_threshold:warning
          for: 30m
          annotations:
            summary: >-
              {{ $labels.model_name }} ({{ $labels.device }}) on {{ $labels.instance }}
              has held {{ $value }}°C for 30m, above its warning threshold
          labels:
            severity: warning

        - alert: SmartDeviceCriticalTemperature
          expr: |
            smart:device_temperature:current
              >= on (instance, device) group_left ()
                 smart:device_temperature_threshold:critical
          for: 15m
          annotations:
            summary: >-
              {{ $labels.model_name }} ({{ $labels.device }}) on {{ $labels.instance }}
              has held {{ $value }}°C for 15m and is approaching its thermal limit
          labels:
            severity: critical

        # Call out specific device
        - alert: SmartDeviceTemperatureOutlier
          expr: |
            (
              smart:device_temperature:current
                - on (model_name) group_left ()
                  quantile by (model_name) (0.5, smart:device_temperature:current)
            ) > 15
          for: 1h
          annotations:
            summary: >-
              {{ $labels.model_name }} ({{ $labels.device }}) on {{ $labels.instance }}
              is running {{ $value }}°C hotter than its identical siblings — check
              airflow, fan and heatsink seating on this host
          labels:
            severity: warning

        - alert: SmartDeviceTestFailed
          expr: |
            (smartctl_device_smart_status != 1 or smartctl_device_status != 1)
          for: 5m
          annotations:
            summary: >-
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }} did not pass its SMART test
          labels:
            severity: critical

        - alert: SmartDeviceCriticalWarning
          expr: |
            smartctl_device_critical_warning != 0
          for: 5m
          annotations:
            summary: >-
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }} is in a critical state
          labels:
            severity: critical

        - alert: SmartDeviceMediaErrors
          expr: |
            smartctl_device_media_errors != 0
          for: 5m
          annotations:
            summary: >-
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }} has media errors
          labels:
            severity: critical

        - alert: SmartDeviceAvailableSpareUnderThreadhold
          expr: |
            smartctl_device_available_spare_threshold > smartctl_device_available_spare
          for: 5m
          annotations:
            summary: >-
              Device {{ $labels.device }} on instance {{ $labels.instance }} is under available spare threashold
          labels:
            severity: critical

        - alert: SmartDeviceInterfaceSlow
          expr: |
            smartctl_device_interface_speed{speed_type="current"} != on(device, instance, namespace, pod) smartctl_device_interface_speed{speed_type="max"}
          annotations:
            summary: >-
              Device {{ $labels.device }} on instance {{ $labels.instance }} interface is slower then it should be
          for: 5m
          labels:
            severity: critical
