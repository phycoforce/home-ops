---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.giantswarm.io/silence_v1alpha1.json
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: ceph-node-nfsmount-diskspace-warning
spec:
  matchers:
    - name: alertname
      value: CephNodeDiskspaceWarning
      isRegex: false
    - name: mountpoint
      value: /etc/nfsmount.conf
      isRegex: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.giantswarm.io/silence_v1alpha1.json
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: ceph-node-local-diskspace-warning
spec:
  matchers:
    - name: alertname
      value: CephNodeDiskspaceWarning
      isRegex: false
    - name: device
      value: /dev/nvme.*
      isRegex: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.giantswarm.io/silence_v1alpha1.json
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: nas-memory-high-utilization
spec:
  matchers:
    - name: alertname
      value: NodeMemoryHighUtilization
      isRegex: false
    - name: instance
      value: aionios.internal:9100
      isRegex: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.giantswarm.io/silence_v1alpha1.json
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: ceph-node-network-packet-errors
spec:
  matchers:
    - name: alertname
      value: CephNodeNetworkPacketErrors
      isRegex: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: hpa-maxed-out
spec:
  matchers:
    - name: alertname
      value: KubeHpaMaxedOut
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
# Transient during ceph upgrades / node reboots: mgr failover briefly emits
# duplicate ceph_pool_metadata series, breaking the pools-group join rules
# (CephPoolGrowthWarning etc). Upstream rook/rook#14338 & #14427, wontfix.
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: ceph-pools-rule-eval-failures
spec:
  matchers:
    - name: alertname
      value: PrometheusRuleFailures
    - name: rule_group
      value: .*rook-ceph-prometheus-ceph-rules.*;pools
      matchType: =~