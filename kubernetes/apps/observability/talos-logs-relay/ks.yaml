---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: talos-logs-relay
spec:
  dependsOn:
    - name: victoria-logs
  interval: 1h
  path: ./kubernetes/apps/observability/talos-logs-relay/app
  # No postBuild: the Fluent Bit config uses ${NODE_NAME}, which Fluent Bit
  # reads from its environment, and Flux would substitute it first
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: talos-logs-relay
    namespace: flux-system
  wait: false
  targetNamespace: observability
