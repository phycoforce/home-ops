---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman-cloud
spec:
  chartRef:
    kind: OCIRepository
    name: barman-cloud
  interval: 1h
  values:
    # Keep resource names aligned with upstream defaults; the Helm release
    # name stays "barman-cloud" so the live release upgrades in place.
    fullnameOverride: plugin-barman-cloud
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
