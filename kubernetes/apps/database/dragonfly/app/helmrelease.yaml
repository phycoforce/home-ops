---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  interval: 1h
  values:
    manager:
      image:
        # default docker.dragonflydb.io is a proxy for ghcr.io (identical digests); pull the source directly
        repository: ghcr.io/dragonflydb/operator
    rbacProxy:
      # metrics stay plain HTTP on :8080, scraped in-cluster only — the TLS/authz sidecar buys nothing here
      enabled: false
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
      grafanaOperator:
        enabled: true
        matchLabels:
          dashboards: grafana
