---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
spec:
  chartRef:
    kind: OCIRepository
    name: shelfmark
  interval: 1h
  values:
    controllers:
      shelfmark:
        annotations:
          secret.reloader.stakater.com/reload: shelfmark-secret
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
        containers:
          shelfmark:
            image:
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.3.11@sha256:394b703c5409a8669af246179d8e5ec23b971565b35000c9ac1e150454d66e1c
            env:
              FLASK_PORT: &port 80
              CUSTOM_DNS: system
              BOOK_LANGUAGE: en
              # Pin the bypasser via env: env beats UI-persisted settings on every
              # boot and locks the UI toggle, so this can't drift back into the
              # flaresolverr-ghost or surprise-Chromium states again.
              USE_CF_BYPASS: true
              USING_EXTERNAL_BYPASSER: false
              # Undocumented env-only switch; without it every boot auto-launches
              # Chromium ~15s in (warmup search), which is what turned OOM into a
              # crashloop. User searches still use the bypasser normally.
              SEARCH_WARMUP_ENABLED: false
              # Reap the persistent bypass helper (new in v1.3.11) after 60s idle
              # instead of 180s to release its memory sooner.
              BYPASS_BROWSER_IDLE_TIMEOUT: 60
              CALIBRE_WEB_URL: https://bookboss.${SECRET_DOMAIN}
              BOOKS_OUTPUT_MODE: folder
              INGEST_DIR: /books
              FILE_ORGANIZATION: rename
              FILE_ORGANIZATION_AUDIOBOOK: rename
              AUTO_OPEN_DOWNLOADS_SIDEBAR: true
              PROWLARR_ENABLED: true
              PROWLARR_URL: http://prowlarr.media.svc.cluster.local
              PROWLARR_USENET_CLIENT: sabnzbd
              SABNZBD_URL: http://sabnzbd.download.svc.cluster.local
            envFrom:
              - secretRef:
                  name: shelfmark-secret
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                # Upstream: 2GB is the safe minimum with Direct Download enabled;
                # the internal Chromium bypasser peaks well past 512Mi (OOM loop).
                # Bypasses are serialized (one browser max), so this doesn't scale
                # with MAX_CONCURRENT_DOWNLOADS. The dshm tmpfs counts against it.
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        existingClaim: shelfmark
      nfs-nas-media:
        type: nfs
        server: aionios.internal
        path: /mnt/mechonis/media
        advancedMounts:
          shelfmark:
            shelfmark:
              - path: /books
                subPath: Downloads/books
      tmpfs:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /var/log
            subPath: var-log
      dshm:
        # Chromium (the internal Cloudflare bypasser) uses /dev/shm and shelfmark
        # doesn't pass --disable-dev-shm-usage; the containerd default is 64Mi,
        # which crashes renderers mid-solve ("No download URL found" failures).
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        globalMounts:
          - path: /dev/shm
    route:
      app:
        hostnames:
          - shelfmark.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
