# Hermes config.yaml keys owned by Git.
#
# The init container yq-merges this file OVER /opt/data/config.yaml on
# every start: keys here always win, while keys hermes writes at runtime (the
# "always approve" allowlist, `hermes config set`, schema migrations, model
# selection) survive restarts. Do not add secrets here; hermes resolves ${VAR}
# from the pod environment at runtime and Flux substitution is disabled on this
# ConfigMap.

# Main model: Claude Sonnet 5.5 on the Claude Max plan's usage limits, through
# the claude-subscription-directsdk provider plugin (installed by the init
# container). Every model call runs the pinned `claude -p` as the Max account
# logged in once with `claude auth login`; there is no API key, and the plugin
# refuses to start with any ANTHROPIC_* key in the environment.
model:
  provider: claude-subscription-directsdk-experimental
  default: claude-sonnet-5-5
  # The route is 1M. Capped so a long-lived chat session compresses (at 50%
  # of this) before every turn re-sends a huge context against the plan's
  # limits; raise it if compression bites too early.
  context_length: 262144

providers:
  claude-subscription-directsdk-experimental:
    # process:// counts as a local endpoint, so hermes's stale-call watchdog
    # is off and a hung `claude -p` would hold the turn for the full 1800s
    # request timeout. This bounds the whole call, not a silence.
    stale_timeout_seconds: 900

# No fallback model: a lapsed login or an exhausted plan fails the turn in
# Matrix instead of quietly answering from another model. To bring Z.ai back,
# uncomment this plus GLM_API_KEY (externalsecret.yaml) and GLM_BASE_URL
# (helmrelease.yaml).
# fallback_providers:
#   - provider: zai
#     model: glm-5.3-flash

# Side tasks. Any task not listed runs on the main model ("auto"): compression,
# background_review (the post-turn memory/skill pass, which replays the chat on
# the warm prompt cache), goal_judge and /review stay on Sonnet. Images also go
# to Sonnet natively because the plugin's routes declare vision, so
# auxiliary.vision is deliberately unset. The tasks hermes itself marks as
# short or cheap-model jobs run on Haiku 5.5 instead.
auxiliary:
  # One call per new session.
  title_generation:
    provider: claude-subscription-directsdk-experimental
    model: claude-haiku-5-5
    reasoning_effort: low
  # Skill consolidation; only runs if curator.consolidate is turned on.
  curator:
    provider: claude-subscription-directsdk-experimental
    model: claude-haiku-5-5
  # Mail importance scorer, profile blurbs, kanban triage: unused today.
  monitor:
    provider: claude-subscription-directsdk-experimental
    model: claude-haiku-5-5
    reasoning_effort: low
  profile_describer:
    provider: claude-subscription-directsdk-experimental
    model: claude-haiku-5-5
    reasoning_effort: low
  triage_specifier:
    provider: claude-subscription-directsdk-experimental
    model: claude-haiku-5-5

toolsets:
  - hermes-cli

agent:
  # Browser tools need Chromium plus the /dev/shm tmpfs; keep off until wanted.
  disabled_toolsets:
    - browser

terminal:
  # Unsandboxed shell inside the pod, as UID 10000 with a read-only root fs.
  backend: local
  cwd: /opt/data/workspace
  timeout: 180

approvals:
  # Every dangerous terminal command asks the human in chat. "smart" (the
  # default) lets an auxiliary LLM auto-approve, which is the wrong gate for a
  # chat-driven agent that reads untrusted web content as input.
  mode: manual
  timeout: 300
  cron_mode: deny
  unattended_mode: deny

memory:
  # memini native MemoryProvider, installed by the init container into
  # /opt/data/plugins/memini. Endpoint, namespace and key come from the
  # MEMINI_* pod env. Gives automatic recall before each turn and per-turn
  # capture; the MCP route would be model-initiated only.
  provider: memini

privacy:
  # Gateway output is tee'd to stdout and lands in VictoriaLogs.
  redact_pii: true

security:
  redact_secrets: true
