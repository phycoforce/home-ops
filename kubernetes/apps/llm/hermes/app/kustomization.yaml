---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
# The kopiur component's Restore leaves the mover at its image UID (65532),
# and non-root hermes cannot chown restored files back, so restore as the
# KOPIUR_PUID/PGID set in ../ks.yaml. Patched here because cluster-apps
# replaces any spec.patches list on the Flux Kustomization.
patches:
  - target:
      kind: Restore
    patch: |-
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      metadata:
        name: hermes
      spec:
        mover:
          podSecurityContext:
            fsGroup: ${KOPIUR_PGID}
          securityContext:
            runAsUser: ${KOPIUR_PUID}
            runAsGroup: ${KOPIUR_PGID}
configMapGenerator:
  - name: hermes-config
    files:
      - ./config/config.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # config.yaml carries hermes's own ${VAR} references (resolved from the
    # pod env at runtime); keep Flux from substituting them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
