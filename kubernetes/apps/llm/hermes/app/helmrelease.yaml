---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        # Exactly one writer per data volume: sessions, the SQLite state DB and
        # memory stores are not safe for concurrent access.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Runs to completion before the app starts (not a sidecar). It seeds
          # the data volume with the bits hermes cannot take from a read-only
          # mount: the merged config.yaml, an empty .env, the kopia ignore file,
          # the memini memory-provider plugin, the Claude subscription provider
          # plugin with its Claude Code CLI, and the cron scripts.
          init:
            image:
              repository: docker.io/mikefarah/yq
              tag: 4.54.1@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e
            env:
              # The plugin is versioned in lockstep with the memini server chart.
              # renovate: datasource=github-tags depName=eleboucher/memini
              MEMINI_PLUGIN_REF: v0.7.32
              # Native Claude Code CLI behind the directsdk provider. Haiku 5.5
              # (the auxiliary tasks) needs >= 2.1.293, so this tracks `latest`;
              # the `stable` channel was still 2.1.287 on 2026-10-13.
              # renovate: datasource=npm depName=@anthropic-ai/claude-code
              CLAUDE_CODE_VERSION: 2.1.296
              # The plugin repo has no tags. Bump to the commit hermes-agent's
              # plugin-catalog/claude-subscription-directsdk.yaml pins whenever
              # the hermes image is upgraded.
              DIRECTSDK_PLUGIN_REF: 682b22d019a1109421faa62efe43e16b23c2ebef
            command:
              - sh
              - -c
              - |
                set -eu
                # Hermes rewrites config.yaml at runtime (schema migrations, the
                # "always approve" allowlist, `hermes config set`), so the Git
                # copy is merged OVER the on-disk file rather than replacing it.
                if [ -f /opt/data/config.yaml ]; then
                  yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
                    /opt/data/config.yaml /config/config.yaml > /opt/data/config.yaml.merged
                  mv /opt/data/config.yaml.merged /opt/data/config.yaml
                else
                  cp /config/config.yaml /opt/data/config.yaml
                fi
                chmod 640 /opt/data/config.yaml
                # $HERMES_HOME/.env is loaded with override=True and would shadow
                # the external-secrets env; the image seeds it from .env.example
                # on first boot unless it exists. Keep an empty one.
                [ -f /opt/data/.env ] || : > /opt/data/.env
                mkdir -p /opt/data/workspace
                # Keep credential stores and caches out of kopiur snapshots.
                # OAuth refresh tokens are single-use, so a restored copy is
                # poison; re-auth after a restore instead. The 250 MB claude
                # binary is re-downloaded below when it is missing.
                printf '%s\n' .env auth.json .anthropic_oauth.json .claude/ \
                  '.claude.json*' .local/bin/claude mcp-tokens/ cache/ logs/ \
                  > /opt/data/.kopiaignore
                # memini native MemoryProvider plugin (two stdlib-only files),
                # refreshed only when MEMINI_PLUGIN_REF changes.
                dir=/opt/data/plugins/memini
                if [ "$(cat "$dir/.ref" 2>/dev/null || true)" != "$MEMINI_PLUGIN_REF" ]; then
                  mkdir -p "$dir"
                  # Unbraced on purpose: Flux postBuild substitutes braced vars in
                  # strict mode and fails the build on this pod-only variable.
                  base="https://raw.githubusercontent.com/eleboucher/memini/$MEMINI_PLUGIN_REF/integrations/hermes/plugin/memini"
                  wget -qO "$dir/__init__.py.tmp" "$base/__init__.py"
                  wget -qO "$dir/plugin.yaml.tmp" "$base/plugin.yaml"
                  mv "$dir/__init__.py.tmp" "$dir/__init__.py"
                  mv "$dir/plugin.yaml.tmp" "$dir/plugin.yaml"
                  printf '%s\n' "$MEMINI_PLUGIN_REF" > "$dir/.ref"
                fi
                # claude-subscription-directsdk model-provider plugin (stdlib
                # only). Staged under cache/ and moved in whole: hermes imports
                # every plugins/ subdir whose plugin.yaml says model-provider,
                # so a half-written copy there would load as a second provider.
                dir=/opt/data/plugins/claude-subscription-directsdk
                if [ "$(cat "$dir/.ref" 2>/dev/null || true)" != "$DIRECTSDK_PLUGIN_REF" ]; then
                  stage=/opt/data/cache/claude-subscription-directsdk
                  rm -rf "$stage"
                  mkdir -p "$stage"
                  base="https://raw.githubusercontent.com/NousResearch/hermes-official-plugins/$DIRECTSDK_PLUGIN_REF/claude-subscription-directsdk"
                  for f in plugin.yaml __init__.py directsdk.py directsdk_setup.py \
                    admission.py model_catalog.py inert_mcp.py; do
                    wget -qO "$stage/$f" "$base/$f"
                  done
                  printf '%s\n' "$DIRECTSDK_PLUGIN_REF" > "$stage/.ref"
                  rm -rf "$dir"
                  mv "$stage" "$dir"
                fi
                # Claude Code CLI that the plugin runs for every model call. The
                # npm -g install it suggests cannot write a read-only root, so
                # fetch the native binary into ~/.local/bin (on the image PATH
                # and in the plugin's search list), checked against the
                # release manifest's sha256.
                bin=/opt/data/.local/bin
                if [ ! -x "$bin/claude" ] || \
                  [ "$(cat "$bin/.claude-version" 2>/dev/null || true)" != "$CLAUDE_CODE_VERSION" ]; then
                  mkdir -p "$bin"
                  base="https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION"
                  sum=$(wget -qO- "$base/manifest.json" | yq -p json '.platforms["linux-x64"].checksum')
                  wget -qO "$bin/claude.tmp" "$base/linux-x64/claude"
                  echo "$sum  $bin/claude.tmp" | sha256sum -c -
                  chmod 755 "$bin/claude.tmp"
                  mv "$bin/claude.tmp" "$bin/claude"
                  printf '%s\n' "$CLAUDE_CODE_VERSION" > "$bin/.claude-version"
                fi
                # Cron scripts load only from /opt/data/scripts (the job itself
                # is created by hand; see the script's header).
                mkdir -p /opt/data/scripts
                cp /config/claude-login-check.sh /opt/data/scripts/claude-login-check.sh
        containers:
          app:
            image:
              # Docker Hub is the only registry upstream publishes to.
              # Never track latest/main: they are a different rolling digest.
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            # No `command:` — the image ENTRYPOINT execs s6-overlay /init, which
            # owns the bootstrap (volume seeding, profile reconcile, dashboard).
            args:
              - gateway
              - run
            env:
              TZ: Europe/London
              HOME: /opt/data
              HERMES_HOME: /opt/data
              # The gateway runs supervised by s6 (`gateway run` becomes a
              # `sleep infinity` heartbeat). Do NOT set HERMES_GATEWAY_NO_SUPERVISE:
              # a SIGTERM'd gateway leaves gateway_state.json at "running" on the
              # PVC, so every later boot's reconciler starts the s6 slot and the
              # foreground run exits 1 ("already running under s6"). Probes still
              # see a dead gateway: /health is served by its api_server platform.
              # BOOTSTRAP_STATE seeds "running" on a fresh volume for the first boot.
              HERMES_GATEWAY_BOOTSTRAP_STATE: running
              # s6 preinit with readOnlyRootFilesystem: / is read-only and /run
              # is a kubelet emptyDir (root:10000 2777) that preinit cannot
              # chown because allowPrivilegeEscalation=false disables its setuid.
              S6_READ_ONLY_ROOT: "1"
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              # OpenAI-compatible API plus the unauthenticated /health probe.
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: &apiPort 8642
              # Web dashboard. A non-loopback bind fails closed without an auth
              # provider, so the basic-auth vars in hermes-secret are load-bearing.
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: &dashboardPort 9119
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes.${SECRET_DOMAIN}
              # memini native memory provider (see config.yaml memory.provider).
              # MEMINI_BASE_URL is the variable the plugin reads; MEMINI_URL is
              # a silent no-op that falls back to localhost. Top-level namespace:
              # hermes is a personal assistant, so it neither inherits the
              # cluster-ops memory in home-ops nor can write into it.
              MEMINI_BASE_URL: http://memini.llm.svc.cluster.local:8080
              MEMINI_NAMESPACE: hermes
              # Z.ai global pay-as-you-go endpoint. Without it the zai provider
              # sends a test request with the key to all four Z.ai endpoints
              # (global, China, and both Coding Plan variants) to find one.
              # Parked with GLM_API_KEY while hermes runs on the Claude plan.
              # GLM_BASE_URL: https://api.z.ai/api/paas/v4
              # The Claude Code CLI is pinned by the init container: never let
              # it self-update on the PVC (blocks a manual `claude update` too),
              # and skip its warnings about the hand-placed install.
              DISABLE_UPDATES: "1"
              DISABLE_INSTALLATION_CHECKS: "1"
              # Matrix gateway platform, enabled by HOMESERVER + ACCESS_TOKEN
              # (token in hermes-secret). The in-cluster Service keeps the bot
              # off the ingress path; the user ID comes from whoami.
              MATRIX_HOMESERVER: http://tuwunel.communication.svc.cluster.local
              # Default-deny: the only sender hermes answers and the only
              # inviter it accepts. Never set MATRIX_ALLOW_ALL_USERS.
              MATRIX_ALLOWED_USERS: "@phy:${SECRET_DOMAIN}"
              # Unencrypted rooms only (already the default; explicit on purpose).
              # Cron delivery into E2EE rooms has open upstream bugs.
              MATRIX_E2EE_MODE: "off"
              # The chat room with @phy: cron results and cross-platform messages
              # land here. Set in Git only; /sethome writes /opt/data/.env, which
              # would shadow this forever. Room IDs are not secrets.
              MATRIX_HOME_ROOM: &matrixRoom "!9ZyuaZtauBknwSui0KxYVzKxTN1qQTMCGYKiEER-01g"
              # The bot only responds in listed rooms. DM-classified rooms (two
              # members or fewer) bypass this, so it guards future group rooms.
              MATRIX_ALLOWED_ROOMS: *matrixRoom
              # Talos has no unprivileged user namespaces; Chromium needs these
              # if the browser toolset is ever enabled.
              AGENT_BROWSER_ARGS: "--no-sandbox,--disable-dev-shm-usage"
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *apiPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *apiPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 200m
                # Peak was ~630Mi on Z.ai; every model call now also runs a
                # `claude -p` process, up to three at once (turn, title,
                # background review).
                memory: 1536Mi
              limits:
                memory: 3Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      # The agent has no business talking to the kube API directly.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        # 10000 is the `hermes` user baked into the image. The s6 stage2 hook
        # exits 1 for any other non-root UID, so the cluster's 1001 convention
        # cannot apply here; the only alternative is starting as root.
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *dashboardPort
          api:
            port: *apiPort
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-config
        advancedMounts:
          hermes:
            init:
              - path: /config
                readOnly: true
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
      tmp:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /tmp
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          hermes:
            app:
              - path: /dev/shm
