---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-secret
    template:
      engineVersion: v2
      # Explicit keys only: everything in this Secret becomes a pod env var.
      data:
        # >= 16 chars or the API server refuses to start (non-retryable);
        # `openssl rand -hex 32`. Must be present from the FIRST boot, or the
        # image generates one into /opt/data/.env that shadows this forever.
        API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
        # Dashboard auth provider; a non-loopback bind fails closed without it.
        # _SECRET keeps sessions valid across restarts (32+ random bytes).
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "{{ .HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}"
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ .HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}"
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: "{{ .HERMES_DASHBOARD_BASIC_AUTH_SECRET }}"
        # memini bearer for the native memory provider. Prefer a named key
        # bound to its own top-level namespace (see the PR notes for the curl).
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        # Charm Hyper inference key (sk-hyper-...), read via providers.hyper.key_env.
        HYPER_API_KEY: "{{ .HYPER_API_KEY }}"
  dataFrom:
    - extract:
        key: hermes
