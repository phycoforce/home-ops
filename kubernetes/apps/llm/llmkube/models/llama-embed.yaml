---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-embed
spec:
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      vendor: intel
      layers: -1
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-llama-gpu
  resources:
    cpu: "250m"
    # 2Gi was OOMKilled 6x on 2026-09-16 (working set peaked at 1.87GiB): the
    # 16384-token ubatch needed for long-document embeddings keeps large host-side
    # buffers, and Vulkan staging memory is charged to this cgroup as well.
    memory: 4Gi
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-embed
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-embed
  replicas: 1
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11515@sha256:b7ac2b757dd43ab04fdc236b9e96a0020ba8566d0b8c33839add482e93c80f3b
  podLabels:
    igpu-workload: "true"
  # Hard pin: one LLM per iGPU, sharing ontos's GPU with immich (microservices +
  # machine-learning). Layout table:
  # kubernetes/apps/kube-system/intel-gpu-resource-driver/app/helmrelease.yaml
  # Deliberately a nodeSelector rather than a soft preference: if ontos is down
  # this model stays Pending instead of stacking onto another already-shared iGPU.
  nodeSelector:
    kubernetes.io/hostname: ontos
  contextSize: 32768
  parallelSlots: 2
  batchSize: 16384
  uBatchSize: 16384
  extraArgs:
    - --alias
    - llama-embed
    - --embeddings
    - --pooling
    - last
    - --cont-batching
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --load-mode
    - mmap
    # Disable the host-RAM prompt cache (default 8192 MiB). Embedding tasks never
    # read it back, yet --cache-idle-slots (default on) saves every idle slot's KV
    # state into it, so RSS ratchets per distinct input until OOMKilled.
    # https://github.com/ggml-org/llama.cpp/issues/26293 (fix PR #26893, unmerged)
    - --cache-ram
    - "0"
  env:
    - name: ZES_ENABLE_SYSMAN
      value: "1"
    - name: ONEAPI_DEVICE_SELECTOR
      value: level_zero:gpu
    - name: UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS
      value: "1"
    - name: LD_LIBRARY_PATH
      value: /app
  resources:
    cpu: 250m
    memory: 4Gi # keep in step with Model.spec.resources.memory above
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 102
    supplementalGroups:
      - 44
      - 102
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  endpoint:
    port: 8080
    type: ClusterIP
