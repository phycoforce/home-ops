---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubectl
spec:
  image: docker.io/rohitghumare64/kubectl-mcp-server:2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount: kubectl-mcp-readonly
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --read-only
            # 2.0 exits on a non-loopback bind without OAuth; exposure is unchanged from 1.x.
            - --allow-unauthenticated
            # 2.0 loads only core+helm by default; add the ecosystems this cluster runs.
            # helm is left out: its release tools all need Secrets (Forbidden by design),
            # and the flux MCP covers HelmRelease history.
            - --toolsets
            - core,diagnostics,crds,certs,cilium
          env:
            - name: MCP_K8S_PROVIDER
              value: in-cluster
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FASTMCP_LOG_LEVEL
              value: WARNING
          volumeMounts:
            # Image HOME/WORKDIR /home/mcp is 0700 for UID 10001 but ToolHive runs as 1000;
            # without this FastMCP crashes on import (PermissionError stat-ing ./.env).
            - name: home
              mountPath: /home/mcp
      volumes:
        - name: home
          emptyDir: {}
  groupRef:
    name: mcp-tools
