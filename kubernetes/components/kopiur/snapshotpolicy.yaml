---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Persistent
      storageClassName: miroir-replicated
    # The mover must run as the UID that owns the app's files: kopia cannot
    # read owner-only files through group bits. Override per app in ks.yaml.
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1001}
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1001}
      runAsGroup: ${KOPIUR_PGID:=1001}
    ttlSecondsAfterFinished: 300
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
